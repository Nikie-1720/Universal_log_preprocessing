name: ULPF CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no deps - core is stdlib only)
        run: pip install --no-deps -e .
      - name: Validate shipped configs
        run: python -m ulpf validate --config configs/pipeline.yaml
      - name: Run unit + end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Smoke demo parse
        run: python -m ulpf parse samples/demo-mixed.log --limit 5
