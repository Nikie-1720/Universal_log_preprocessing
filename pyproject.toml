[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpf"
version = "2.0.0"
description = "Universal Log Pre-processing Framework (ULPF) - ingest, parse, normalize and standardize any log into a lossless, analytics-ready universal event schema."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ULPF Project" }]
keywords = ["siem", "logs", "normalization", "security", "etl", "cybersecurity", "soc"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

# PostgreSQL is required for the persistent ULPF storage layer.
# The core parsing/normalization engine itself remains standard-library based.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]                 # full YAML support
kafka = ["kafka-python>=2.0.2"]
postgres = ["psycopg[binary]>=3.2,<4"]        # optional Kafka sink
dev = ["pytest>=7.0"]

[project.scripts]
ulpf = "ulpf.cli:main"

[tool.setuptools.packages.find]
include = ["ulpf*","storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]